[project]
name = "comet-example-manage-data"
version = "0.1.0"
description = "Comet Artifacts guides: local assets, generic remote links, and S3/GCS synced remote assets"
requires-python = ">=3.10"
dependencies = [
    "comet_ml>=3.44.0",
    "pandas",
    "scikit-learn",
    "joblib",
    "boto3",
    "google-cloud-storage",
]

# WHY: this folder holds scripts to run, not a library to install - keep uv from trying to build it.
[tool.uv]
package = false
